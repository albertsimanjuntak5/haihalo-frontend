<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HaiHalo Chat</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0b141a; color: #e9edef; display: flex; height: 100vh; }
    
    /* Login Overlay */
    #login-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 999; }
    .login-box { background: #111b21; padding: 25px; border-radius: 8px; text-align: center; width: 320px; }
    .login-box input { width: 100%; padding: 10px; margin: 15px 0; border-radius: 5px; border: 1px solid #222d34; background: #2a3942; color: #fff; }
    .login-box button { width: 100%; padding: 10px; background: #00a884; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
    
    /* Sidebar */
    .sidebar { width: 300px; background-color: #111b21; border-right: 1px solid #222d34; display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; background: #202c33; display: flex; justify-content: space-between; align-items: center; }
    .search-box { padding: 10px; }
    .search-box input { width: 100%; padding: 8px; background: #202c33; border: none; border-radius: 5px; color: white; }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item { padding: 12px 15px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid #182229; }
    .user-item:hover, .user-item.active { background-color: #2a3942; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #00a884; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .badge { background: #00a884; color: black; font-size: 11px; padding: 2px 6px; border-radius: 10px; margin-left: auto; }

    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; }
    .chat-header { padding: 15px; background: #202c33; display: flex; align-items: center; gap: 12px; }
    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 60%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-break: break-word; }
    .message.sent { background-color: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
    .message.received { background-color: #202c33; align-self: flex-start; border-top-left-radius: 0; }
    
    .chat-input-area { padding: 10px 15px; background: #202c33; display: flex; gap: 10px; align-items: center; }
    .chat-input-area input { flex: 1; padding: 10px; background: #2a3942; border: none; border-radius: 8px; color: white; }
    .chat-input-area button { padding: 10px 20px; background: #00a884; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-logout { background: #ea4335; border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Modal Login -->
  <div id="login-modal">
    <div class="login-box">
      <h2>HaiHalo Login</h2>
      <input type="text" id="username-input" placeholder="Masukkan Username...">
      <button onclick="handleLogin()">Masuk</button>
    </div>
  </div>

  <!-- Sidebar Users -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div>
        <strong id="display-username">User</strong>
      </div>
      <button class="btn-logout" onclick="handleLogout()">Keluar</button>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Cari pengguna..." oninput="filterUsers()">
    </div>
    <div class="user-list" id="user-list"></div>
  </div>

  <!-- Main Chat Box -->
  <div class="chat-area">
    <div class="chat-header" id="chat-header">
      <div class="avatar" id="header-avatar">?</div>
      <div>
        <h4 id="header-title">Pilih Teman Obrolan</h4>
        <small id="header-status" style="color: #00a884;"></small>
      </div>
    </div>

    <div class="messages-container" id="messages-container"></div>

    <div class="chat-input-area">
      <input type="text" id="message-input" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">Kirim</button>
    </div>
  </div>

  <script>
    const BACKEND_URL = "http://localhost:5000"; // Sesuaikan URL Backend jika di-host online
    const socket = io(BACKEND_URL);

    let currentUser = localStorage.getItem("haihalo_user");
    let activeTarget = null;
    let allUsers = [];
    let unreadUsers = new Set();

    // ---------------- INITIALIZATION ----------------
    window.onload = () => {
      if (currentUser) {
        document.getElementById("login-modal").style.display = "none";
        initApp();
      }
    };

    function initApp() {
      document.getElementById("display-username").innerText = currentUser;
      
      // Registrasi user ke room socket saat pertama kali dimuat
      if (socket.connected) {
        socket.emit("register_user", currentUser);
      }
      
      loadUsers();
    }

    // ---------------- SOCKET EVENTS ----------------
    socket.on("connect", () => {
      console.log("Connected to WebSocket");
      if (currentUser) {
        socket.emit("register_user", currentUser);
      }
    });

    socket.on("private_message", (data) => {
      const { sender, target, message } = data;

      // Jika obrolan lawan bicara sedang dibuka
      if (
        (sender === activeTarget && target === currentUser) ||
        (sender === currentUser && target === activeTarget)
      ) {
        appendMessage(message, sender === currentUser);
      } 
      // Jika pesan masuk dari user lain
      else if (sender !== currentUser) {
        unreadUsers.add(sender);
        renderUserList(document.getElementById("search-input").value);
      }
    });

    // ---------------- USER MANAGEMENT ----------------
    async function handleLogin() {
      const username = document.getElementById("username-input").value.trim();
      if (!username) return alert("Username tidak boleh kosong!");

      try {
        const res = await fetch(`${BACKEND_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username })
        });
        const data = await res.json();
        
        if (data.status === "success") {
          currentUser = username;
          localStorage.setItem("haihalo_user", currentUser);
          document.getElementById("login-modal").style.display = "none";
          initApp();
        } else {
          alert("Login gagal!");
        }
      } catch (err) {
        alert("Gagal terhubung ke server backend.");
      }
    }

    function handleLogout() {
      localStorage.removeItem("haihalo_user");
      location.reload();
    }

    async function loadUsers() {
      try {
        const res = await fetch(`${BACKEND_URL}/users?current_user=${currentUser}`);
        const data = await res.json();
        allUsers = data.users || [];
        renderUserList();
      } catch (err) {
        console.error("Gagal memuat pengguna:", err);
      }
    }

    function renderUserList(query = "") {
      const listEl = document.getElementById("user-list");
      listEl.innerHTML = "";

      const filtered = allUsers.filter(u => u.toLowerCase().includes(query.toLowerCase()));

      filtered.forEach(user => {
        const item = document.createElement("div");
        item.className = `user-item ${user === activeTarget ? "active" : ""}`;
        item.onclick = () => selectUser(user);

        const hasUnread = unreadUsers.has(user);

        item.innerHTML = `
          <div class="avatar">${user[0].toUpperCase()}</div>
          <div>
            <strong>${user}</strong>
            <div style="font-size: 12px; color: #8696a0;">Klik untuk mengobrol</div>
          </div>
          ${hasUnread ? `<span class="badge">Baru</span>` : ""}
        `;
        listEl.appendChild(item);
      });
    }

    function filterUsers() {
      const query = document.getElementById("search-input").value;
      renderUserList(query);
    }

    async function selectUser(username) {
      activeTarget = username;
      unreadUsers.delete(username);
      
      document.getElementById("header-avatar").innerText = username[0].toUpperCase();
      document.getElementById("header-title").innerText = username;
      document.getElementById("header-status").innerText = "Online";

      renderUserList(document.getElementById("search-input").value);
      await loadMessages();
    }

    // ---------------- MESSAGES ----------------
    async function loadMessages() {
      if (!activeTarget) return;

      const container = document.getElementById("messages-container");
      container.innerHTML = "";

      try {
        const res = await fetch(`${BACKEND_URL}/messages?user1=${currentUser}&user2=${activeTarget}`);
        const data = await res.json();

        (data.messages || []).forEach(msg => {
          appendMessage(msg.message, msg.sender === currentUser);
        });
      } catch (err) {
        console.error("Gagal memuat pesan:", err);
      }
    }

    function appendMessage(text, isSent) {
      const container = document.getElementById("messages-container");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${isSent ? "sent" : "received"}`;
      msgDiv.innerText = text;
      
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById("message-input");
      const text = input.value.trim();

      if (!text || !activeTarget) return;

      socket.emit("private_message", {
        sender: currentUser,
        target: activeTarget,
        message: text
      });

      input.value = "";
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") sendMessage();
    }
  </script>
</body>
</html>
