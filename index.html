<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HaiHalo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="bg-indigo-600 h-[100dvh] w-screen flex flex-col justify-between overflow-hidden antialiased">

  <!-- ================= HALAMAN AUTH ================= -->
  <div id="auth-screen" class="fixed inset-0 z-50 bg-indigo-600 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 w-full max-w-md text-center">
      
      <h1 id="auth-title" class="text-2xl sm:text-3xl font-bold text-gray-800 mb-2">Masuk ke HaiHalo</h1>
      <p id="auth-subtitle" class="text-gray-500 text-sm sm:text-base mb-4">Masukkan username & password kamu</p>
      
      <div id="alert-msg" class="hidden mb-4 p-3 rounded-xl text-sm font-medium"></div>

      <form onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <input 
            type="text" 
            id="username-input" 
            placeholder="Username..." 
            required
            autocomplete="off"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
          />
        </div>
        <div>
          <input 
            type="password" 
            id="password-input" 
            placeholder="Password..." 
            required
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
          />
        </div>
        
        <button 
          type="submit" 
          id="auth-submit-btn"
          class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold py-3 rounded-xl text-sm sm:text-base transition shadow-md"
        >
          Masuk
        </button>
      </form>

      <div class="mt-6 border-t pt-4 text-xs sm:text-sm text-gray-600">
        <span id="toggle-text">Belum punya akun?</span>
        <button 
          type="button" 
          onclick="toggleAuthMode()" 
          id="toggle-btn"
          class="text-indigo-600 font-semibold ml-1 hover:underline focus:outline-none"
        >
          Daftar
        </button>
      </div>

    </div>
  </div>

  <!-- ================= HALAMAN CHAT ================= -->
  <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center shrink-0">
    <div>
      <h1 class="text-lg sm:text-xl font-bold tracking-wide">HaiHalo</h1>
      <p id="user-display" class="text-xs text-indigo-200">User: -</p>
    </div>
    <!-- Tombol Keluar menggantikan indikator status -->
    <button 
      onclick="handleLogout()" 
      class="bg-indigo-700 hover:bg-indigo-800 active:scale-95 text-white text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-xl transition border border-indigo-500 shadow-sm"
    >
      Keluar
    </button>
  </header>

  <main id="chat-box" class="bg-gray-100 flex-1 overflow-y-auto p-4 space-y-3 w-full max-w-4xl mx-auto">
    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200 max-w-[85%] sm:max-w-[70%] w-fit">
      <p class="text-gray-800 text-sm sm:text-base">Selamat datang! Kamu berhasil masuk.</p>
    </div>
  </main>

  <footer class="bg-white p-3 border-t border-gray-200 shrink-0 w-full max-w-4xl mx-auto">
    <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2 items-center">
      <input 
        type="text" 
        id="message-input" 
        placeholder="Ketik pesan..." 
        autocomplete="off"
        class="flex-1 border border-gray-300 rounded-xl px-4 py-2.5 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
      />
      <button 
        type="submit" 
        class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white px-5 py-2.5 rounded-xl text-sm sm:text-base font-semibold transition shrink-0"
      >
        Kirim
      </button>
    </form>
  </footer>

  <script>
const backendUrl = "https://web-production-0d3df9.up.railway.app";
    const socket = io(backendUrl, { transports: ["websocket", "polling"] });

    let currentUser = "";
    let isRegisterMode = false;

    const alertMsg = document.getElementById("alert-msg");
    const authScreen = document.getElementById("auth-screen");
    const authTitle = document.getElementById("auth-title");
    const authSubmitBtn = document.getElementById("auth-submit-btn");
    const toggleText = document.getElementById("toggle-text");
    const toggleBtn = document.getElementById("toggle-btn");
    const usernameInput = document.getElementById("username-input");
    const passwordInput = document.getElementById("password-input");
    const userDisplay = document.getElementById("user-display");
    const chatBox = document.getElementById("chat-box");
    const messageInput = document.getElementById("message-input");

    // CEK SESSION SAAT HALAMAN DI-REFRESH
    window.addEventListener("DOMContentLoaded", () => {
      const savedUser = localStorage.getItem("haihalo_user");
      if (savedUser) {
        currentUser = savedUser;
        userDisplay.innerText = `User: ${currentUser}`;
        authScreen.classList.add("hidden");
      }
    });

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      hideAlert();
      if (isRegisterMode) {
        authTitle.innerText = "Buat Akun Baru";
        authSubmitBtn.innerText = "Daftar";
        toggleText.innerText = "Sudah punya akun?";
        toggleBtn.innerText = "Masuk";
      } else {
        authTitle.innerText = "Masuk ke HaiHalo";
        authSubmitBtn.innerText = "Masuk";
        toggleText.innerText = "Belum punya akun?";
        toggleBtn.innerText = "Daftar";
      }
    }

    function showAlert(message, isError = true) {
      alertMsg.innerText = message;
      alertMsg.className = isError 
        ? "mb-4 p-3 rounded-xl text-sm font-medium bg-red-100 text-red-700 block"
        : "mb-4 p-3 rounded-xl text-sm font-medium bg-green-100 text-green-700 block";
    }

    function hideAlert() {
      alertMsg.className = "hidden mb-4 p-3 rounded-xl text-sm font-medium";
    }

    async function handleAuth(e) {
      e.preventDefault();
      hideAlert();

      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      const endpoint = isRegisterMode ? "/register" : "/login";

      try {
        const response = await fetch(`${backendUrl}${endpoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (response.ok && result.status === "success") {
          if (isRegisterMode) {
            showAlert("Registrasi berhasil! Silakan masuk.", false);
            toggleAuthMode();
          } else {
            currentUser = username;
            // Simpan ke localStorage agar tidak ter-reset saat refresh
            localStorage.setItem("haihalo_user", username);
            userDisplay.innerText = `User: ${currentUser}`;
            authScreen.classList.add("hidden");
            passwordInput.value = "";
          }
        } else {
          showAlert(result.message || "Username atau password tidak sesuai");
        }
      } catch (err) {
        showAlert("Gagal terhubung ke server backend.");
      }
    }

    // FUNGSI LOGOUT (Hapus session dari localStorage)
    function handleLogout() {
      currentUser = "";
      localStorage.removeItem("haihalo_user");
      userDisplay.innerText = "User: -";
      usernameInput.value = "";
      passwordInput.value = "";
      hideAlert();
      
      if (isRegisterMode) {
        toggleAuthMode();
      }
      
      authScreen.classList.remove("hidden");
    }

    function sendMessage(e) {
      e.preventDefault();
      const msg = messageInput.value.trim();
      if (msg !== "") {
        const fullMessage = `${currentUser}: ${msg}`;
        appendMessage(msg, true);
        socket.emit("message", fullMessage);
        messageInput.value = "";
      }
    }

    socket.on("message", (data) => {
      if (typeof data === "string" && !data.startsWith(`${currentUser}:`)) {
        appendMessage(data, false);
      }
    });

    function appendMessage(text, isSelf) {
      const wrapper = document.createElement("div");
      wrapper.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'}`;

      const bubble = document.createElement("div");
      bubble.className = isSelf 
        ? "bg-indigo-600 text-white p-3 rounded-2xl shadow-sm max-w-[85%] sm:max-w-[70%] text-sm sm:text-base break-words"
        : "bg-white text-gray-800 p-3 rounded-2xl shadow-sm border border-gray-200 max-w-[85%] sm:max-w-[70%] text-sm sm:text-base break-words";
      
      bubble.innerText = text;
      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
